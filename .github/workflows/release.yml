name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: winterswang/xueqiu-analyzer-skill
          path: _deps/xueqiu-analyzer-skill
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install ruff==0.12.4 pytest==7.4.3
      - run: pip install -e _deps/xueqiu-analyzer-skill
      - run: ruff check . && ruff format --check .
      - run: python scripts/sync_waf_patterns.py --check
      - run: find . -maxdepth 2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check && find lib -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python -m pytest tests/ -q

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = json.loads(Path("opencli-plugin.json").read_text())["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match plugin version {expected!r}")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
