[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.opencli-adapters]
# 唯一 WAF 规则源；CI checkout 该仓并 editable-install 后运行生成器和漂移测试。
waf-pattern-source = "_deps/xueqiu-analyzer-skill/src/xueqiu_analyzer/waf.py"
